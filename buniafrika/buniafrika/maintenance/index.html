<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#123b32">
  <title>Site Under Maintenance</title>
  <style>
    :root {
      color-scheme: light;
      --green: #123b32;
      --green-light: #e7f0ec;
      --text: #17231f;
      --muted: #5e6d66;
      --paper: #fbfcfa;
      --accent: #d4a94f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 680px);
      text-align: center;
      padding: clamp(28px, 6vw, 56px);
      background: #fff;
      border: 1px solid #e3e9e5;
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(18, 59, 50, .08);
    }
    .mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--green-light);
      color: var(--green);
    }
    .mark svg { width: 38px; height: 38px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }
    .intro {
      max-width: 490px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.75;
    }
    .rule {
      width: 58px;
      height: 3px;
      margin: 28px auto;
      background: var(--accent);
      border-radius: 2px;
    }
    .note {
      margin: 0;
      color: var(--text);
      font-size: .96rem;
      line-height: 1.7;
    }
    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: .85rem;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v5l3 2"></path>
      </svg>
    </div>
    <p class="eyebrow">We'll be back soon</p>
    <h1>Site Under Maintenance</h1>
    <p class="intro">
      We’re making a few improvements to serve you better.
      Our website is temporarily unavailable while we complete this work.
    </p>
    <div class="rule" aria-hidden="true"></div>
    <p class="note">
      Thank you for your patience and understanding.<br>
      Please check back soon.
    </p>
    <footer>&copy; <span id="year"></span> BuniAfrika. Thank you for your support.</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
