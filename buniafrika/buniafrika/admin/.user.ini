[PHP]
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
display_errors = Off
error_log = "error_log"
log_errors = On
max_input_vars = 1000
session.gc_maxlifetime = 1440
zlib.output_compression = Off
